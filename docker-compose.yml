version: '3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
      - redis-data:/data
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          memory: 14G
        limits:
          memory: 15G

volumes:
  ollama-models:  
  redis-data:     