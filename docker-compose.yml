services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8501:8501"  # Explicitly bind to all interfaces
      - "0.0.0.0:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
      - redis-data:/data
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          memory: 14G
        limits:
          memory: 15G

volumes:
  ollama-models:  
  redis-data:     
